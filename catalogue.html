<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>VTHM STREET - Catalogue</title>
  <link rel="icon" href="logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{--accent:#c9a84c;--darker:#090909;--light:#f5f0eb;--mid:#888;--card-bg:#141414}
    body{background:var(--darker);color:var(--light);font-family:'Montserrat',sans-serif;min-height:100vh}
    .hero{padding:4rem 3rem 2.5rem;display:flex;justify-content:space-between;align-items:flex-end;gap:2rem}
    .hero-title{font-family:'Cormorant Garamond',serif;font-size:clamp(2.5rem,7vw,6rem);font-weight:300;line-height:.92}
    .hero-title em{font-style:italic;color:var(--accent);display:block}
    .hero-meta{text-align:right;flex-shrink:0}
    .hero-meta p{font-size:.58rem;letter-spacing:.3em;color:var(--mid);text-transform:uppercase;margin-bottom:.4rem}
    .hero-count{font-size:2rem;font-family:'Cormorant Garamond',serif;color:var(--accent);font-weight:300}
    .filters{display:flex;gap:.5rem;padding:1.2rem 3rem;border-bottom:1px solid rgba(255,255,255,.06);border-top:1px solid rgba(255,255,255,.06);flex-wrap:wrap}
    .filter-btn{font-size:.56rem;letter-spacing:.22em;text-transform:uppercase;padding:.45rem 1.2rem;border:1px solid rgba(255,255,255,.12);background:transparent;color:var(--mid);cursor:pointer;transition:all .3s;font-family:'Montserrat',sans-serif}
    .filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(201,168,76,.06)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:2px;padding:2px}
    .card{background:var(--card-bg);position:relative;overflow:hidden;cursor:pointer;animation:fadeUp .5s ease both}
    @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
    .card-img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;transition:transform .7s cubic-bezier(.25,.46,.45,.94),filter .5s;filter:grayscale(15%)}
    .card:hover .card-img{transform:scale(1.04);filter:grayscale(0%)}
    .card-info{position:absolute;bottom:0;left:0;right:0;padding:1.4rem 1.6rem;background:linear-gradient(to top,rgba(0,0,0,.72),transparent)}
    .card-name{font-family:'Cormorant Garamond',serif;font-size:1.05rem;letter-spacing:.03em;font-weight:300}
    .card-price{font-size:.68rem;letter-spacing:.18em;color:var(--accent);margin-top:.25rem}
    .card-tag{position:absolute;top:.9rem;left:.9rem;font-size:.48rem;letter-spacing:.22em;text-transform:uppercase;background:var(--accent);color:#000;padding:.28rem .65rem;font-weight:600}
    .card-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.88),transparent 55%);display:flex;flex-direction:column;justify-content:flex-end;padding:1.6rem;transform:translateY(100%);transition:transform .45s cubic-bezier(.25,.46,.45,.94)}
    .card:hover .card-overlay{transform:translateY(0)}
    .taille-select{background:#1a1a1a;border:1px solid rgba(201,168,76,.35);color:var(--light);font-size:.55rem;letter-spacing:.18em;padding:.4rem .8rem;cursor:pointer;font-family:'Montserrat',sans-serif;margin-bottom:.8rem;width:100%}
    .card-btn{font-size:.56rem;letter-spacing:.22em;text-transform:uppercase;border:1px solid var(--accent);color:var(--accent);padding:.55rem 1.4rem;transition:all .3s;cursor:pointer;background:transparent;font-family:'Montserrat',sans-serif;width:100%}
    .card-btn:hover:not(:disabled){background:var(--accent);color:#000}
    .card-btn:disabled{opacity:.5;cursor:not-allowed}
    .skeleton{background:linear-gradient(90deg,#141414 25%,#1e1e1e 50%,#141414 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;aspect-ratio:3/4}
    @keyframes shimmer{to{background-position:-200% 0}}
    .empty{text-align:center;padding:6rem 2rem;color:var(--mid);grid-column:1/-1}
    .empty h2{font-family:'Cormorant Garamond',serif;font-size:2.5rem;font-weight:300;margin-bottom:1rem}
    footer{text-align:center;padding:2.5rem;font-size:.53rem;letter-spacing:.28em;color:rgba(255,255,255,.18);text-transform:uppercase;border-top:1px solid rgba(255,255,255,.06);margin-top:2rem}
    footer a{color:var(--accent);text-decoration:none}
  </style>
</head>
<body>
<script src="data.js"></script>
<div id="navPlaceholder"></div>
<div class="hero">
  <div class="hero-title" id="heroTitle"></div>
  <div class="hero-meta">
    <p>Pièces disponibles</p>
    <div class="hero-count" id="heroCount">—</div>
    <p style="margin-top:.6rem">Livraison offerte dès 150 €</p>
  </div>
</div>
<div class="filters" id="filters"></div>
<div class="grid" id="grid"></div>
<footer><a href="index.html">← Accueil</a> &nbsp;·&nbsp; VTHM Street &nbsp;·&nbsp; Collection 2025</footer>
<script>
const params   = new URLSearchParams(location.search);
const genre    = params.get('genre') || 'homme';
const catParam = params.get('cat')   || '';

document.getElementById('heroTitle').innerHTML = genre === 'homme'
  ? `Collection<br><em>Automne</em>2025`
  : `<em>Collection</em>Automne<br>2025`;
if (genre === 'femme') document.documentElement.style.setProperty('--accent','#b08a8a');

const catsDef = genre === 'homme'
  ? [['','Tout'],['vestes','Vestes & Manteaux'],['chemises','Chemises'],['pantalons','Pantalons'],['pulls','Pulls'],['tops','Tops'],['accessoires','Accessoires']]
  : [['','Tout'],['robes','Robes'],['jupes','Jupes'],['vestes','Vestes & Manteaux'],['pantalons','Pantalons'],['tops','Tops'],['chemisiers','Chemisiers'],['accessoires','Accessoires']];

catsDef.forEach(([k,l]) => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn' + (k===catParam||(!catParam&&k==='')?  ' active':'');
  btn.textContent = l;
  btn.onclick = () => {
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderProducts(k);
    const u = new URL(location); k?u.searchParams.set('cat',k):u.searchParams.delete('cat');
    history.replaceState(null,'',u);
  };
  document.getElementById('filters').appendChild(btn);
});

function showSkeletons() {
  document.getElementById('grid').innerHTML = Array(8).fill('<div class="card"><div class="skeleton"></div></div>').join('');
}

async function renderProducts(cat) {
  showSkeletons();
  let prods;
  try { prods = await DB.getProducts({ genre, ...(cat?{categorie:cat}:{}) }); }
  catch(e) { document.getElementById('grid').innerHTML=`<div class="empty"><h2>Erreur</h2><p>${e.message}</p></div>`; return; }

  document.getElementById('heroCount').textContent = prods.length;
  const grid = document.getElementById('grid');
  if (!prods.length) { grid.innerHTML=`<div class="empty"><h2>Aucun article</h2><p>Catégorie vide.</p></div>`; return; }

  grid.innerHTML = '';
  prods.forEach((p,i) => {
    const c = document.createElement('div');
    c.className = 'card'; c.style.animationDelay = i*.06+'s';

    if (p.tag) {
      const tag = document.createElement('span');
      tag.className = 'card-tag';
      tag.textContent = p.tag;
      c.appendChild(tag);
    }

    const img = document.createElement('img');
    img.className = 'card-img'; img.alt = p.nom; img.loading = 'lazy'; img.src = p.img;
    c.appendChild(img);

    const info = document.createElement('div');
    info.className = 'card-info';
    info.innerHTML = `<div class="card-name">${p.nom}</div><div class="card-price">${Number(p.prix).toFixed(2)} €</div>`;
    c.appendChild(info);

    const overlay = document.createElement('div');
    overlay.className = 'card-overlay';
    overlay.innerHTML = `
      <div class="card-name" style="margin-bottom:.3rem">${p.nom}</div>
      <div class="card-price" style="margin-bottom:.8rem">${Number(p.prix).toFixed(2)} €</div>
      <select class="taille-select" id="t-${p.id}"><option>XS</option><option>S</option><option selected>M</option><option>L</option><option>XL</option></select>
      <button class="card-btn" id="b-${p.id}" onclick="add(${p.id})">Ajouter au panier</button>`;
    c.appendChild(overlay);

    grid.appendChild(c);
  });
}

async function add(id) {
  const btn = document.getElementById('b-'+id);
  const taille = document.getElementById('t-'+id)?.value||'M';
  btn.disabled=true; btn.textContent='…';
  try {
    await DB.addToCart(id, taille);
    showToast('Article ajouté');
    btn.textContent='Ajouté';
    setTimeout(()=>{btn.textContent='Ajouter au panier';btn.disabled=false;},2000);
  } catch(e) { showToast('Erreur : '+e.message); btn.textContent='Ajouter au panier'; btn.disabled=false; }
}

initPage(genre).then(()=>renderProducts(catParam));
</script>
</body>
</html>
