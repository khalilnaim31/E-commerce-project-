<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>VTHM Street</title>
  <link href="logo.png" rel="shortcut icon" type="image/x-icon" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{--gold:#c9a84c;--dark:#0d0d0d;--light:#f5f0eb}
    body{background:var(--dark);font-family:'Montserrat',sans-serif;height:100vh;overflow:hidden;cursor:none}
    .cursor{width:10px;height:10px;background:var(--gold);border-radius:50%;position:fixed;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:transform .15s}
    .cursor-ring{width:36px;height:36px;border:1px solid rgba(201,168,76,.5);border-radius:50%;position:fixed;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:all .3s}
    .container{display:flex;height:100vh;width:100%}
    .panel{flex:1;position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;cursor:none;transition:flex .7s cubic-bezier(.77,0,.175,1)}
    .panel:hover{flex:1.4}
    .panel-homme::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(201,168,76,.04) 0%,transparent 60%),url('https://images.unsplash.com/photo-1617137968427-85924c800a22?w=900&q=80') center/cover no-repeat;opacity:.25;transition:opacity .7s}
    .panel-homme:hover::before{opacity:.45}
    .panel-femme::before{content:'';position:absolute;inset:0;background:linear-gradient(225deg,rgba(201,168,76,.04) 0%,transparent 60%),url('https://images.unsplash.com/photo-1581044777550-4cfa60707c03?w=900&q=80') center/cover no-repeat;opacity:.25;transition:opacity .7s}
    .panel-femme:hover::before{opacity:.45}
    .divider{position:absolute;left:50%;top:10%;height:80%;width:1px;background:linear-gradient(to bottom,transparent,var(--gold),transparent);z-index:10;transform:translateX(-50%)}
    .logo{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;text-align:center;pointer-events:none}
    .logo-text{font-family:'Cormorant Garamond',serif;font-size:clamp(2rem,5vw,4rem);font-weight:300;letter-spacing:.5em;color:var(--light);text-transform:uppercase;display:block;animation:fadeIn 1.5s ease forwards}
    .logo-sub{font-size:.6rem;letter-spacing:.35em;color:var(--gold);text-transform:uppercase;display:block;margin-top:.4rem;animation:fadeIn 2s ease forwards}
    .panel-content{position:relative;z-index:5;text-align:center;padding:2rem}
    .panel-label{font-family:'Cormorant Garamond',serif;font-size:clamp(2.5rem,6vw,5rem);font-weight:300;color:var(--light);letter-spacing:.2em;text-transform:uppercase;opacity:0;transform:translateY(20px);animation:riseIn 1s ease .5s forwards}
    .panel-femme .panel-label{font-style:italic}
    .panel-cta{display:inline-block;margin-top:1.5rem;font-size:.65rem;letter-spacing:.3em;color:var(--gold);text-transform:uppercase;border-bottom:1px solid rgba(201,168,76,.4);padding-bottom:4px;opacity:0;animation:riseIn 1s ease .9s forwards;text-decoration:none;transition:color .3s,border-color .3s}
    .panel-cta:hover{color:var(--light);border-color:var(--light)}
    .panel-num{position:absolute;bottom:2.5rem;font-size:.55rem;letter-spacing:.25em;color:rgba(255,255,255,.2);text-transform:uppercase}
    /* Barre haut */
    .top-bar{position:fixed;top:1.2rem;right:2rem;z-index:30;display:flex;gap:1.2rem;align-items:center}
    .top-bar a,.top-bar span{font-size:.55rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.5);text-decoration:none;transition:color .3s;cursor:pointer}
    .top-bar a:hover{color:var(--gold)}
    .top-cart{position:relative;font-size:1rem}
    .cart-badge{position:absolute;top:-6px;right:-8px;background:var(--gold);color:#000;font-size:.5rem;font-weight:700;min-width:16px;height:16px;border-radius:50%;display:none;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes riseIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    a{text-decoration:none;color:inherit}
  </style>
</head>
<body>
<script src="data.js"></script>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>
<div class="top-bar" id="topBar"></div>

<div class="logo">
  <span class="logo-text">VTHM Street</span>
  <span class="logo-sub">Maison de mode — Choisissez votre univers</span>
</div>
<div class="divider"></div>

<div class="container">
  <a href="catalogue.html" class="panel panel-homme">
    <div class="panel-content"><div class="panel-label">Homme</div><span class="panel-cta">Découvrir la collection →</span></div>
    <span class="panel-num">Collection 2026</span>
  </a>
  <a href="catalogue.html" class="panel panel-femme">
    <div class="panel-content"><div class="panel-label">Femme</div><span class="panel-cta">Découvrir la collection →</span></div>
    <span class="panel-num">Collection 2026</span>
  </a>
</div>

<script>
const cursor=document.getElementById('cursor'),ring=document.getElementById('cursorRing');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cursor.style.left=mx+'px';cursor.style.top=my+'px';});
(function loop(){rx+=(mx-rx)*.12;ry+=(my-ry)*.12;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(loop);})();
document.querySelectorAll('a').forEach(el=>{
  el.addEventListener('mouseenter',()=>{cursor.style.transform='translate(-50%,-50%) scale(2)';ring.style.transform='translate(-50%,-50%) scale(1.5)';});
  el.addEventListener('mouseleave',()=>{cursor.style.transform='translate(-50%,-50%) scale(1)';ring.style.transform='translate(-50%,-50%) scale(1)';});
});

async function initIndex() {
  await DB.init();
  const user=DB.currentUser();
  const bar =document.getElementById('topBar');
  if (user) {
    bar.innerHTML=`<span>${user.nom.split(' ')[0]}</span>
      ${DB.isAdmin()?`<a href="admin.html">Admin</a>`:''}
      <a href="#" onclick="doLogout()">Déconnexion</a>
      <a href="panier.html" class="top-cart">🛍<span class="cart-badge">0</span></a>`;
  } else {
    bar.innerHTML=`<a href="compte.html">Connexion</a>
      <a href="panier.html" class="top-cart">🛍<span class="cart-badge">0</span></a>`;
  }
  updateCartBadge();
}
initIndex();
</script>
</body>
</html>
